{{- $password := include "stockpilot.dbPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.dbSecretName" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" (.Values.postgres.username | urlquery) ($password | urlquery) (include "stockpilot.dbHost" .) .Values.postgres.database | quote }}
