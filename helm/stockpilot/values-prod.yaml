# AWS EKS (cluster from ../terraform). Image repository/tag are set by CI with --set.
backend:
  replicaCount: 2
  hpa: {enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 60}
frontend:
  replicaCount: 2
postgres:
  storage:
    size: 10Gi
    storageClass: gp3    # from k8s/storageclass-gp3.yaml
ingress:
  enabled: true
  className: nginx
  host: ""               # browse to the ingress-nginx load balancer hostname
monitoring:
  serviceMonitor: {enabled: true}
  grafanaDashboard: {enabled: true}
