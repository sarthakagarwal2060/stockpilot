# Local cluster (kind / minikube / Docker Desktop) with ingress-nginx installed.
#   helm upgrade --install stockpilot ./helm/stockpilot -n stockpilot --create-namespace -f helm/stockpilot/values-dev.yaml
# Add "127.0.0.1 stockpilot.local" to /etc/hosts.
backend:
  image: {repository: stockpilot-backend, tag: local, pullPolicy: IfNotPresent}
  hpa: {enabled: false}
frontend:
  image: {repository: stockpilot-frontend, tag: local, pullPolicy: IfNotPresent}
postgres:
  password: stockpilot
  storage: {size: 1Gi}
ingress:
  enabled: true
  host: stockpilot.local
monitoring:
  serviceMonitor: {enabled: false}
  grafanaDashboard: {enabled: false}
