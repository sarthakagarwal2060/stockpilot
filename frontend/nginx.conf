# Runs as non-root (nginx-unprivileged), so listen on 8080.
# BACKEND_URL is substituted at container start by the nginx image's envsubst templates:
#   Docker Compose -> http://backend:8000
#   Kubernetes     -> http://<release>-stockpilot-backend:8000 (set by the Helm chart)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
