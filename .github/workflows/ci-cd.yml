name: StockPilot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: quality gate ----------
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------- Stage 2: build, scan, push ----------
  build-scan-push:
    name: Build, scan (Trivy), push (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/stockpilot-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Build image (tagged with commit SHA)
        run: docker build -t ${{ steps.meta.outputs.image }}:${{ github.sha }} ./${{ matrix.component }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned to SHA: supply-chain safety)
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}

  # ---------- Stage 3: deploy ----------
  # Runs only when the KUBE_CONFIG_DATA secret exists (i.e. after the EKS cluster is up).
  deploy:
    name: Deploy to EKS (Helm)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v7

      - name: Skip if cluster credentials are not configured
        id: guard
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret not set - skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v5
        if: steps.guard.outputs.enabled == 'true'

      - name: Configure kubectl
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade --install
        if: steps.guard.outputs.enabled == 'true'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot --create-namespace \
            -f helm/stockpilot/values-prod.yaml \
            --set backend.image.repository="ghcr.io/${owner}/stockpilot-backend" \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository="ghcr.io/${owner}/stockpilot-frontend" \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Show rollout
        if: steps.guard.outputs.enabled == 'true'
        run: |
          kubectl get pods,svc,ingress,hpa -n stockpilot
          helm history stockpilot -n stockpilot --max 5
